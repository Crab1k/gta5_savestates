[Savestate]
; ---- Keys ----
; To change a key, replace the name after "=" with another one from this list, save this file, and start the game
; again with GTA5-Savestates.exe (keys are read at start):
;   F1 ... F24, A ... Z, 0 ... 9 (top row), NumPad0 ... NumPad9, Insert, Delete, Home, End, PageUp, PageDown,
;   Up, Down, Left, Right, Pause, ScrollLock, Backspace, Tab, Enter, Space, NumPadAdd, NumPadSubtract,
;   NumPadMultiply, NumPadDivide, NumPadDecimal, Minus, Equals, Comma, Period, Semicolon, Slash, Backquote,
;   LeftBracket, Backslash, RightBracket, Quote, MouseMiddle, Mouse4, Mouse5 (the mouse side buttons),
;   or a Windows virtual-key code (120 or 0x78 is F9).
; Upper or lower case doesn't matter; empty = the default shown here. Pick keys the game doesn't use for something
; else (see its key bindings in Settings). A name the program doesn't know is noted in savestate.log.
; Save a savestate to the current slot (default F9):
SaveKey=F9
; Previous / next slot, 10 slots (default F10 / F11):
PrevSlotKey=F10
NextSlotKey=F11
; Load the current slot (default F12):
LoadKey=F12

; 1 = show "Savestate 1 saved ..." etc. in the top-left corner of the game.
ShowMessages=1

; Folder for the savestate files (about 1 GB each). Empty = the "savestates" folder next to the launcher.
Folder=

; Address space reserved for the game's Windows-heap blocks, in MB. The game uses only a few MB of it.
ArenaMB=512

[Launcher]
; The GTA V folder (with GTA5.exe and PlayGTAV.exe). Empty = the folder Rockstar's installer recorded, else ask once.
Game=
; The game starts as Project 1.27's Launch button starts it, with P127's settings (language, crash/stutter/audio fixes,
; your own arguments, "core fix", high priority), or its defaults if it isn't installed. Only to change that:
; Arguments for the game. Empty = as Project 1.27 (e.g. -uilanguage american).
Arguments=
; Limit the game to the first 4-16 CPU threads (P127's "core fix"; without it GTA V 1.27 fails with ERR_SYS_THREAD on
; CPUs with many threads). Empty = as set in Project 1.27; 1 = on; 0 = off.
CoreFix=
; Set GTA5.exe to high priority 5 s after start. Empty = as set in Project 1.27; 1 = on; 0 = off.
HighPriority=
